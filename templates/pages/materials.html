{% extends "base.html" %}

{% block title %}материалы{% endblock %}

{% block content %}
<div class="materials-page">
    <div class="materials-list">
        {% for material in materials %}
            <div class="material-card">
                <a href="{{ material.url }}" target="_blank">{{ material.title }}</a>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
